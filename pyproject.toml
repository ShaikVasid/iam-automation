[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-iam-automation"
version = "0.2.0"
description = "Azure RBAC automation and least-privilege validation portfolio project"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.17,<2.0",
  "azure-mgmt-authorization>=4.0,<5.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
