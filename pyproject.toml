[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-automation"
version = "0.1.0"
description = "AWS IAM automation and policy validation portfolio project"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2.0",
  "PyYAML>=6.0,<7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
