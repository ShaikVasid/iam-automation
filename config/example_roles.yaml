roles:
  - name: application-readonly
    description: Example least-privilege application role
    policy:
      actions:
        - s3:GetObject
        - s3:ListBucket
      resources:
        - arn:aws:s3:::example-application-bucket
        - arn:aws:s3:::example-application-bucket/*

  - name: intentionally-broad-example
    description: Example used by the validator test suite
    policy:
      actions:
        - s3:GetObject
      resources:
        - "*"
